[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lcmv_xtra"
version = "0.1.0"
description = "LCMV beamforming for high-density EEG with enhanced coregistration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "CIMT", email = "cimt@informatik.uni-augsburg.de"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mne>=1.6",
    "nilearn>=0.10",
    "nibabel>=5.0",
    "pandas>=2.0",
    "tqdm",
    "numpy>=1.21",
    "scipy",
    "mne-connectivity>=1.0"  # ← Added missing dependency
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lcmv_xtra*"]
exclude = ["notebooks*"]

[tool.setuptools.package-data]
lcmv_xtra = ["data/**/*"]

[project.urls]
Homepage = "https://github.com/cimt-unia/lcmv_xtra"
Repository = "https://github.com/cimt-unia/lcmv_xtra.git"
